server:
  port: 8080

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**

            - id: shopkeeper-service
              uri: lb://SHOPKEEPER-SERVICE
              predicates:
                - Path=/shopkeepers/**

            - id: item-service
              uri: lb://ITEM-SERVICE
              predicates:
                - Path=/items/**

            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/transactions/**

            - id: ledger-service
              uri: lb://LEDGER-SERVICE
              predicates:
                - Path=/ledgers/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payments/**

            - id: invoice-service
              uri: lb://INVOICE-SERVICE
              predicates:
                - Path=/invoices/**

            - id: report-service
              uri: lb://REPORT-SERVICE
              predicates:
                - Path=/reports/**

            - id: shop-service
              uri: lb://SHOPKEEPER-SERVICE
              predicates:
                - Path=/shop/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

jwt:
  secret: mySuperSecretKeyForKaathaApp1234567890